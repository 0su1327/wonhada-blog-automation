version: '3.8'
services:
  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=여기에_비밀번호_설정
      - GENERIC_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
      # 로컬 전용이라 도메인/HTTPS 관련 환경변수는 필요 없습니다.
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - naver-poster

  naver-poster:
    build: ./naver-poster
    restart: unless-stopped
    volumes:
      - naver_session:/data
    expose:
      - "4000"

volumes:
  n8n_data:
  naver_session:
